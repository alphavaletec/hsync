[package]
name = "hsync"
version = "0.1.1"
description = "Gerenciador visual de sincronização e backup em nuvem baseado no Rclone"
authors = ["Alpha Vale Tecnologias"]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[lib]
name = "hsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
# Só falamos HTTP em 127.0.0.1 com o rclone: nenhuma pilha TLS é necessária.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
getrandom = "0.4"
zeroize = "1"
# "Liberar espaço" na aba Arquivos manda a cópia local para a Lixeira (recuperável).
trash = "5"
# Sincronização "na modificação": observa as pastas locais das tarefas.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# Arquivos sob demanda (estilo OneDrive): Windows Cloud Filter API.
cloud-filter = "0.0.6"
nt-time = "0.8"
win32job = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# cloud-filter 0.0.6 com correções (ver vendor/cloud-filter/HSYNC-PATCH.md): falha de download
# sob demanda derrubava o app (pânico dentro do callback do Windows).
[patch.crates-io]
cloud-filter = { path = "vendor/cloud-filter" }
